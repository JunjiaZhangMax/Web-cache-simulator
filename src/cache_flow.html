<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cache Flow</title>
<style>
  body {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 16px;
    font: 14px/1.5 Arial, sans-serif;
    color: #222;
  }

  h1 {
    font-size: 32px;
  }

  h2 {
    font-size: 24px;
    margin-top: 24px;
  }

  button,
  select {
    padding: 5px 8px;
    font: inherit;
  }

  .controls,
  .flow {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 16px 0;
  }

  .flow span {
    padding: 8px 16px;
    border: 1px solid #ccc;
  }

  .active,
  .selected {
    background: #e6f0ff;
  }

  #timeline,
  meter {
    width: 100%;
  }

  #requestInfo,
  #detail {
    overflow-wrap: anywhere;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
  }

  th,
  td {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    overflow-wrap: anywhere;
  }

  th {
    background: #f5f5f5;
    font-size: 16px;
  }

  .scroll {
    overflow: auto;
    max-height: 360px;
  }

  #cacheEntries {
    height: 280px;
    scrollbar-gutter: stable;
  }

  #cacheEntries table {
    table-layout: fixed;
  }

  #cacheEntries th {
    position: sticky;
    top: 0;
  }

  #log tr {
    cursor: pointer;
  }

  #log tr:hover {
    background: #f5f5f5;
  }

  #metrics,
  footer {
    margin-top: 20px;
  }

  footer {
    color: #666;
    font-size: 12px;
  }
</style>
<main>
  <h1>Cache Flow</h1>
  <label>Policy <select id="policy">
      <option>FIFO</option>
      <option>LRU</option>
      <option>LFU</option>
    </select></label>
  <label>Speed <select id="speed">
      <option value="1600">Slow</option>
      <option value="850" selected>Normal</option>
      <option value="300">Fast</option>
    </select></label>
  <p id="position" aria-live="polite"></p>
  <input id="timeline" type="range" min="0" value="0" aria-label="Operation timeline">
  <div class="controls">
    <button id="reset">Reset</button><button id="prev">Previous</button><button id="play">Play</button>
    <button id="next">Next</button><button id="nextRequest">Next request</button>
  </div>
  <h2 id="phase">Ready</h2>
  <p id="requestInfo"></p>
  <div class="flow"><span id="client">Client</span> &rarr; <span id="cache">Shared cache</span> &harr; <span
      id="origin">Origin</span></div>
  <p id="detail" aria-live="polite"></p>
  <p id="rule"></p>
  <h2>Cache contents</h2>
  <label>Capacity <span id="used"></span><meter id="capacity" min="0" aria-label="Cache usage"></meter></label>
  <div class="scroll" id="cacheEntries">
    <table>
      <thead>
        <tr>
          <th>URL</th>
          <th>Size (KiB)</th>
          <th>Insertion order</th>
          <th>Last access</th>
          <th>Access count</th>
        </tr>
      </thead>
      <tbody id="entries"></tbody>
    </table>
  </div>
  <p id="metrics"></p>
  <h2>Request trace</h2>
  <p>Click a row to jump to the completed request.</p>
  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Client</th>
          <th>Time</th>
          <th>URL</th>
          <th>Result</th>
          <th>Latency (ms)</th>
          <th>Evictions</th>
        </tr>
      </thead>
      <tbody id="log"></tbody>
    </table>
  </div>
  <footer id="source"></footer>
</main>
<script id="trace-data" type="application/json">__TRACE_DATA__</script>
<script>
  'use strict';
  const $ = id => document.getElementById(id);
  const data = JSON.parse($('trace-data').textContent);
  const escape = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const kib = bytes => (bytes / 1024).toFixed(1);
  const percent = (part, total) => (total ? part / total * 100 : 0).toFixed(1) + '%';
  const rules = {
    FIFO: 'FIFO evicts the earliest inserted resource. Hits do not change insertion order.',
    LRU: 'LRU evicts the least recently accessed resource.',
    LFU: 'LFU evicts the least frequently accessed resource, breaking ties with LRU.'
  };
  const phases = { start: 'Ready', request: 'Cache lookup', hit: 'Cache hit', miss: 'Origin fetch', evict: 'Eviction', insert: 'Cache insertion', bypass: 'Cache bypass', return: 'Return to client' };
  let policy = 'FIFO', index = 0, timer = null;
  const trace = () => data.traces[policy];
  function stop() {
    clearInterval(timer);
    timer = null;
    $('play').textContent = 'Play';
  }
  function go(value) {
    index = Math.max(0, Math.min(value, trace().frames.length - 1));
    if (index === trace().frames.length - 1) stop();
    render();
  }
  function render() {
    const t = trace(), f = t.frames[index], r = t.results[f.request_index], s = f.totals;
    $('timeline').max = t.frames.length - 1;
    $('timeline').value = index;
    $('position').textContent = `Operation ${index} / ${t.frames.length - 1} | Request ${f.request_index + 1} / ${t.results.length}`;
    $('phase').textContent = phases[f.phase];
    $('requestInfo').textContent = r ? `${r.client_id} | ${r.timestamp} | ${r.url} | ${kib(r.size_bytes)} KiB` : 'Start with an empty cache. Requests follow input file order.';
    const active = ['miss', 'bypass'].includes(f.phase) ? 'origin' : f.phase === 'return' ? 'client' : f.phase === 'start' ? '' : 'cache';
    for (const id of ['client', 'cache', 'origin']) $(id).classList.toggle('active', id === active);
    $('detail').textContent = f.message
      + (f.phase === 'evict' ? ` Removed: ${f.focus}` : '')
      + (f.phase === 'return' ? ` Latency: ${r.latency_ms} ms. Origin traffic: ${kib(r.cache_hit ? 0 : r.size_bytes)} KiB.` : '');
    $('rule').textContent = rules[policy];
    $('used').textContent = `${kib(f.used_bytes)} / ${kib(data.capacity_bytes)} KiB`;
    $('capacity').max = data.capacity_bytes || 1;
    $('capacity').value = f.used_bytes;
    $('entries').innerHTML = f.entries.length ? f.entries.map(e => `<tr class="${e.url === f.focus ? 'selected' : ''}"><td>${escape(e.url)}</td><td>${kib(e.size_bytes)}</td><td>${e.insertion_order}</td><td>${e.last_access}</td><td>${e.access_count}</td></tr>`).join('') : '<tr><td colspan="5">Empty cache</td></tr>';
    $('metrics').textContent = `Completed: ${s.requests} | Hits: ${s.hits} | Misses: ${s.requests - s.hits} | Hit rate: ${percent(s.hits, s.requests)} | Byte hit rate: ${percent(s.hit_bytes, s.bytes)} | Average latency: ${(s.requests ? s.latency_ms / s.requests : 0).toFixed(1)} ms | Origin traffic: ${kib(s.origin_bytes)} KiB`;
    $('log').innerHTML = t.results.map((row, i) => {
      const done = row.frame_index <= index;
      return `<tr tabindex="0" data-index="${i}" aria-label="Jump to request ${i + 1}" class="${i === f.request_index ? 'selected' : ''}"><td>${i + 1}</td><td>${escape(row.client_id)}</td><td>${escape(row.timestamp)}</td><td>${escape(row.url)}</td><td>${done ? (row.cache_hit ? 'HIT' : 'MISS') : 'Pending'}</td><td>${done ? row.latency_ms : '-'}</td><td>${done ? row.removed_urls.length : '-'}</td></tr>`;
    }).join('');
    $('prev').disabled = index === 0;
    $('next').disabled = $('nextRequest').disabled = index === t.frames.length - 1;
    $('play').disabled = t.frames.length === 1;
    $('source').textContent = `Source: ${data.source.resources} + ${data.source.requests}. Capacity: ${data.capacity_bytes} bytes. Hit latency: ${data.hit_latency_ms} ms. Totals include completed requests only. Changing policy resets playback.`;
  }
  function play() {
    if (timer !== null) return stop();
    if (index === trace().frames.length - 1) index = 0;
    $('play').textContent = 'Pause';
    timer = setInterval(() => go(index + 1), Number($('speed').value));
    render();
  }
  $('play').onclick = play;
  for (const [id, target] of [['reset', () => 0], ['prev', () => index - 1], ['next', () => index + 1], ['nextRequest', () => trace().results.find(r => r.frame_index > index)?.frame_index ?? index]]) {
    $(id).onclick = () => { stop(); go(target()); };
  }
  $('timeline').oninput = e => { stop(); go(Number(e.target.value)); };
  $('policy').onchange = e => { stop(); policy = e.target.value; go(0); };
  $('speed').onchange = () => { if (timer !== null) { stop(); play(); } };
  function selectRow(event) {
    const row = event.target.closest('tr[data-index]');
    if (row) { stop(); go(trace().results[Number(row.dataset.index)].frame_index); }
  }
  $('log').onclick = selectRow;
  $('log').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectRow(e); } };
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
  render();
</script>

</html>
